name: Native plugins

# Heavy job (full JUCE compile), so it runs on demand and when the native
# wrapper changes. Artifacts: AU + VST3 + Standalone (macOS), VST3 +
# Standalone (Windows/Linux).
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths: ["native/**", ".github/workflows/native.yml"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfreetype6-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory webview2-sdk

      - name: Build web UI
        run: |
          npm ci
          npm run build

      - name: Configure and build plugins
        run: |
          cmake -B native/build -S native -DCMAKE_BUILD_TYPE=Release -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/webview2-sdk"
          cmake --build native/build --config Release --parallel 3

      - uses: actions/upload-artifact@v4
        with:
          name: moog-muse-interface-${{ runner.os }}
          path: |
            native/build/MoogMuseInterface_artefacts/**/Release/**
            native/build/MoogMuseInterface_artefacts/VST3/**
            native/build/MoogMuseInterface_artefacts/AU/**
            native/build/MoogMuseInterface_artefacts/Standalone/**
          if-no-files-found: error
